[project]
name = "nice-path"
version = "0.1.3"
description = "Nice formatting of paths"
readme = "README.md"
authors = [
    { name = "Tom Koelman", email = "tkoelman@xs4all.nl" }
]
requires-python = ">=3.10"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
license = "MIT-0"
license-files = [ "LICENSE" ]

[project.urls]
repository = "https://github.com/tomkoelman/nice-path.git"
issues = "https://github.com/tomkoelman/nice-path/issues"

[build-system]
requires = ["uv_build>=0.10.7,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
